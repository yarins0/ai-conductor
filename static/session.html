<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live session</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2b2f37;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  /* Single centered column — this window does one thing: run an assistant live. */
  #session {
    width: 100%;
    max-width: 520px;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }
  header { margin-bottom: 20px; }
  header .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  header h1 { margin: 4px 0 0; font-size: 22px; }

  #providerControls { margin-bottom: 12px; }
  .provider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .provider-row label { flex: 0 0 90px; color: var(--muted); font-size: 12px; text-transform: capitalize; }
  .provider-row select {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  #runControls { display: flex; gap: 8px; margin-bottom: 8px; }
  #leadSelect {
    flex: 1;
    /* min-width:0 lets the flex item shrink below its long option text so the
       row doesn't overflow horizontally; the native select truncates instead. */
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #reconnectBtn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); width: 100%; margin-bottom: 12px; }
  #steps { display: flex; flex-direction: column; gap: 8px; }
  .step-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .step-card .step-head { display: flex; align-items: center; gap: 8px; }
  .step-card .step-tool { font-weight: 600; font-size: 14px; }
  .step-card .step-outcome {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .step-card .step-summary { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* The call the assistant had with the lead, inside a reach step. Indented off a
     rule so it reads as a nested conversation, not more step chrome. */
  .call-transcript {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .call-line { display: flex; gap: 8px; font-size: 13px; line-height: 1.45; }
  .call-speaker {
    flex: 0 0 62px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--muted);
    padding-top: 2px;
  }
  .call-assistant .call-speaker { color: var(--accent); }
  .call-text { flex: 1; }
  #outcome { margin-top: 14px; }
  .outcome-badge {
    display: inline-block;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .03em;
    border-radius: 8px;
    padding: 6px 12px;
  }
  .outcome-booked { background: rgba(74, 222, 128, .15); color: #4ade80; border: 1px solid rgba(74, 222, 128, .35); }
  .outcome-not_qualified { background: rgba(251, 191, 36, .15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, .35); }
  .outcome-unreachable { background: rgba(255, 107, 107, .12); color: var(--danger); border: 1px solid rgba(255, 107, 107, .3); }
  .outcome-line { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .session-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .session-error { color: var(--danger); font-size: 13px; }
  #addLeadForm { margin-bottom: 16px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #addLeadForm .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
  #addLeadForm .form-row { margin-bottom: 8px; }
  #addLeadForm input, #addLeadForm select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  #addLeadForm #addLeadBtn { width: 100%; }
  #addLeadError { margin-top: 8px; }
  #addLeadError:empty { display: none; }

  /* Live voice panel (Phase 6) — sits alongside the scripted-run controls. */
  #talkBtn { background: var(--panel); border: 1px solid var(--accent); color: var(--accent); }
  #voicePanel[hidden] { display: none; }
  #voicePanel { margin-bottom: 16px; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #voiceStatus { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #voiceControls { display: flex; gap: 8px; margin-bottom: 10px; }
  #micBtn { flex: 0 0 auto; }
  #micBtn.mic-on { background: var(--danger); }
  #micBtn:disabled { opacity: .5; }
  #transcript { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
  .transcript-line { font-size: 14px; line-height: 1.4; padding: 6px 10px; border-radius: 8px; }
  .transcript-you { background: rgba(91, 140, 255, .12); align-self: flex-end; max-width: 85%; }
  .transcript-assistant { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; max-width: 85%; }
  .transcript-error { color: var(--danger); font-size: 13px; }
  #voiceInputRow { display: flex; gap: 8px; }
  #voiceText {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
</style>

<div id="session">
  <header>
    <div class="eyebrow">Live session</div>
    <h1 id="assistantName">Loading…</h1>
  </header>
  <div id="providerControls"></div>
  <div id="runControls">
    <select id="leadSelect"></select>
    <button id="runBtn" disabled>Run</button>
    <button id="talkBtn">Talk</button>
  </div>
  <button id="reconnectBtn" disabled>Reconnect stream</button>

  <!-- Live voice conversation (Phase 6). Hidden until "Talk" connects. Reuses the
       lead + provider selections above. -->
  <div id="voicePanel" hidden>
    <div id="voiceStatus"></div>
    <div id="voiceControls">
      <button id="micBtn" disabled>Start mic</button>
    </div>
    <div id="transcript"></div>
    <div id="voiceInputRow">
      <input id="voiceText" type="text" placeholder="Type to talk…" autocomplete="off">
      <button id="voiceSendBtn" disabled>Send</button>
    </div>
  </div>
  <div id="addLeadForm">
    <div class="eyebrow">Add lead</div>
    <div class="form-row"><input id="leadName" type="text" placeholder="Name"></div>
    <div class="form-row"><input id="leadCompany" type="text" placeholder="Company"></div>
    <div class="form-row"><input id="leadPhone" type="text" placeholder="Phone"></div>
    <div class="form-row">
      <!-- A lead you type in has no simulation archetype, so "none" is the honest
           default; the profiles below force a simulated lead to behave a set way. -->
      <select id="leadSimProfile" name="leadSimProfile" aria-label="Simulation profile">
        <option value="" selected>no profile — real lead</option>
        <option value="books">simulate: books</option>
        <option value="no_answer">simulate: no_answer</option>
        <option value="not_qualified">simulate: not_qualified</option>
      </select>
    </div>
    <button id="addLeadBtn">Add lead</button>
    <div id="addLeadError" class="session-error"></div>
  </div>
  <div id="steps"></div>
  <div id="outcome"></div>
</div>

<script src="/static/session.js"></script>
<script src="/static/voice.js"></script>
