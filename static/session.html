<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live session</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2b2f37;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  /* Single centered column — this window does one thing: run an assistant live. */
  #session {
    width: 100%;
    max-width: 520px;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }
  header { margin-bottom: 20px; }
  header .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  header h1 { margin: 4px 0 0; font-size: 22px; }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .step-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .step-card .step-head { display: flex; align-items: center; gap: 8px; }
  .step-card .step-tool { font-weight: 600; font-size: 14px; }
  .step-card .step-outcome {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .step-card .step-summary { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* The call the assistant had with the lead, inside a reach step. Indented off a
     rule so it reads as a nested conversation, not more step chrome. */
  .call-transcript {
    margin-top: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .call-line { display: flex; gap: 8px; font-size: 13px; line-height: 1.45; }
  .call-speaker {
    flex: 0 0 62px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--muted);
    padding-top: 2px;
  }
  .call-assistant .call-speaker { color: var(--accent); }
  .call-text { flex: 1; }
  #outcome { margin-top: 14px; }
  .outcome-badge {
    display: inline-block;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .03em;
    border-radius: 8px;
    padding: 6px 12px;
  }
  .outcome-booked { background: rgba(74, 222, 128, .15); color: #4ade80; border: 1px solid rgba(74, 222, 128, .35); }
  .outcome-not_qualified { background: rgba(251, 191, 36, .15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, .35); }
  .outcome-unreachable { background: rgba(255, 107, 107, .12); color: var(--danger); border: 1px solid rgba(255, 107, 107, .3); }
  .outcome-line { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .session-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .session-error { color: var(--danger); font-size: 13px; }

  /* WebRTC voice controls — Connect opens the session, Mute toggles the local
     mic track. No typed fallback: voice is the only interaction now. */
  #voiceControls { display: flex; gap: 8px; margin-bottom: 10px; }
  #voiceStatus { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  /* The whole conversation in one chronological stream: what was said and what
     was done. Tool cards stretch full width against the aligned speech bubbles,
     so a system event never reads as someone talking. Taller than a pure
     transcript needs, since step cards live here now too. */
  #transcript { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; margin-bottom: 10px; }
  .transcript-line { font-size: 14px; line-height: 1.4; padding: 6px 10px; border-radius: 8px; }
  .transcript-you { background: rgba(91, 140, 255, .12); align-self: flex-end; max-width: 85%; }
  .transcript-assistant { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; max-width: 85%; }
  .transcript-error { color: var(--danger); font-size: 13px; }

  /* The spec moved on without this session. Amber, not red: nothing is broken,
     the session is just running an older version of the assistant. */
  .spec-notice {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(251, 191, 36, .1);
    border: 1px solid rgba(251, 191, 36, .35);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    color: #fbbf24;
    font-size: 13px;
    line-height: 1.45;
  }
  .spec-notice button {
    flex: 0 0 auto;
    background: #fbbf24;
    color: #14161a;
    padding: 5px 10px;
    font-size: 12px;
  }

  /* Lead lists and the request_lead picker: a step-card holding one button per lead. */
  .lead-picker { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .lead-picker button { background: var(--panel); border: 1px solid var(--border); color: var(--text); text-align: left; }
  .lead-picker button:hover { border-color: var(--accent); }
</style>

<div id="session">
  <header>
    <div class="eyebrow">Live session</div>
    <h1 id="assistantName">Loading…</h1>
  </header>
  <div id="voiceControls">
    <button id="connectBtn">Connect</button>
    <button id="micMuteBtn" disabled>Mute mic</button>
  </div>
  <div id="voiceStatus"></div>
  <div id="specNotice"></div>
  <div id="transcript"></div>
  <audio id="assistantAudio" autoplay hidden></audio>
  <div id="outcome"></div>
</div>

<script src="/static/session.js"></script>
<script src="/static/realtime.js"></script>
