<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Builder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2b2f37;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .spec-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .spec-item:hover { background: var(--panel); }
  .spec-item.active { background: var(--panel); border: 1px solid var(--accent); }
  .spec-item .name { font-size: 14px; font-weight: 600; }
  .spec-item .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }

  /* Main pane */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px 12px 2px 12px;
    max-width: 70%;
    white-space: pre-wrap;
  }
  .msg-error {
    align-self: flex-start;
    background: rgba(255, 107, 107, .12);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 107, .3);
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
  }
  .msg-loading { align-self: flex-start; color: var(--muted); font-size: 14px; }

  .spec-card {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    max-width: 85%;
  }
  .spec-card h3 { margin: 0 0 8px; font-size: 16px; }
  .spec-card .objective { color: var(--muted); margin-bottom: 10px; }
  .spec-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .spec-card ul { margin: 0; padding-left: 18px; }
  .spec-card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: rgba(91, 140, 255, .15);
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .spec-card details { margin-top: 12px; }
  .spec-card summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .spec-card pre {
    background: #0f1115;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    margin-top: 6px;
  }

  #composer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    min-height: 44px;
    max-height: 160px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:disabled { opacity: .5; cursor: not-allowed; }
</style>

<div id="sidebar">
  <h2>Saved assistants</h2>
  <div id="specList"></div>
</div>

<div id="main">
  <header>Assistant Builder</header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" placeholder="Describe the assistant you want…" rows="1"></textarea>
    <button id="createBtn">Create</button>
  </div>
</div>

<script>
  // Minimal DOM builder — cuts repetitive createElement/setAttribute calls below.
  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.entries(props || {}).forEach(([key, value]) => {
      if (key === "className") node.className = value;
      else if (key === "onclick") node.addEventListener("click", value);
      else node.setAttribute(key, value);
    });
    (children || []).forEach((child) => {
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  }

  const specListEl = document.getElementById("specList");
  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const createBtn = document.getElementById("createBtn");

  let specs = [];
  let activeSpecId = null;

  async function loadSpecs() {
    try {
      const res = await fetch("/api/specs");
      specs = res.ok ? await res.json() : [];
    } catch {
      specs = [];
    }
    renderSidebar();
  }

  function renderSidebar() {
    specListEl.textContent = "";
    if (specs.length === 0) {
      specListEl.appendChild(el("div", { className: "empty-hint" }, ["No assistants yet — create one to get started."]));
      return;
    }
    specs.forEach((spec) => {
      const item = el("div", {
        className: "spec-item" + (spec.id === activeSpecId ? " active" : ""),
        onclick: () => showSpecCard(spec, false),
      }, [
        el("div", { className: "name" }, [spec.name]),
        el("div", { className: "date" }, [new Date(spec.created_at).toLocaleString()]),
      ]);
      specListEl.appendChild(item);
    });
  }

  function appendUserMessage(text) {
    document.getElementById("emptyHint")?.remove();
    logEl.appendChild(el("div", { className: "msg-user" }, [text]));
    logEl.scrollTop = logEl.scrollHeight;
  }

  function appendError(message) {
    logEl.appendChild(el("div", { className: "msg-error" }, [message]));
    logEl.scrollTop = logEl.scrollHeight;
  }

  function buildSpecCard(spec) {
    const card = el("div", { className: "spec-card" });
    card.appendChild(el("h3", {}, [spec.name]));
    card.appendChild(el("div", { className: "objective" }, [spec.objective]));

    card.appendChild(el("div", { className: "label" }, ["Persona"]));
    card.appendChild(el("div", {}, [spec.persona]));

    card.appendChild(el("div", { className: "label" }, ["Instructions"]));
    const list = el("ul", {}, (spec.instructions || []).map((instr) => el("li", {}, [instr])));
    card.appendChild(list);

    card.appendChild(el("div", { className: "label" }, ["Tools"]));
    const chips = el("div", { className: "chips" }, (spec.tools || []).map((tool) => el("span", { className: "chip" }, [tool.name])));
    card.appendChild(chips);

    const details = el("details", {}, [
      el("summary", {}, ["Raw JSON"]),
      el("pre", {}, [JSON.stringify(spec, null, 2)]),
    ]);
    card.appendChild(details);

    return card;
  }

  // Shows a spec in the log. When it's a fresh create (fromCreate), it's appended
  // as a new message; when clicked from the sidebar, it replaces the log with that spec.
  function showSpecCard(entry, fromCreate) {
    if (!fromCreate) {
      activeSpecId = entry.id;
      renderSidebar();
      logEl.textContent = "";
    }
    logEl.appendChild(buildSpecCard(entry.spec));
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setLoading(isLoading) {
    createBtn.disabled = isLoading;
    inputEl.disabled = isLoading;
    let loadingEl = document.getElementById("loadingMsg");
    if (isLoading) {
      loadingEl = el("div", { className: "msg-loading", id: "loadingMsg" }, ["Building…"]);
      logEl.appendChild(loadingEl);
      logEl.scrollTop = logEl.scrollHeight;
    } else if (loadingEl) {
      loadingEl.remove();
    }
  }

  async function handleCreate() {
    const description = inputEl.value.trim();
    if (!description) return;

    appendUserMessage(description);
    inputEl.value = "";
    setLoading(true);

    try {
      const res = await fetch("/api/specs/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description }),
      });
      const data = await res.json();
      setLoading(false);

      if (res.status === 201) {
        activeSpecId = data.id;
        showSpecCard(data, true);
        await loadSpecs();
      } else {
        appendError(data.detail || "Something went wrong generating that assistant.");
      }
    } catch {
      setLoading(false);
      appendError("Network error — could not reach the server.");
    }
  }

  createBtn.addEventListener("click", handleCreate);
  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      handleCreate();
    }
  });

  logEl.appendChild(el("div", { className: "empty-hint", id: "emptyHint" }, ["Describe the assistant you want and hit Create to get started."]));

  loadSpecs();
</script>
