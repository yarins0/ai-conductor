<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Builder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2b2f37;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }

  /* Collapsible side panels: a header row holds the title + a chevron toggle.
     Collapsing swaps a .collapsed class that shrinks the panel to a thin strip
     and hides everything but the toggle. */
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    padding: 0;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .panel-toggle:hover { color: var(--text); border-color: var(--accent); }
  #sidebar.collapsed, #session.collapsed { width: 44px; padding-left: 10px; padding-right: 10px; overflow: hidden; }
  #sidebar.collapsed > *:not(.panel-head), #session.collapsed > *:not(.panel-head) { display: none; }
  #sidebar.collapsed .panel-head h2, #session.collapsed .panel-head h2 { display: none; }
  #sidebar.collapsed .panel-head, #session.collapsed .panel-head { justify-content: center; }
  .spec-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .spec-item:hover { background: var(--panel); }
  .spec-item.active { background: var(--panel); border: 1px solid var(--accent); }
  .spec-item .name { font-size: 14px; font-weight: 600; }
  .spec-item .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  /* Dashed outline reads as "add"; stays quiet so the composer keeps the one filled primary. */
  .new-assistant-btn {
    width: 100%;
    background: transparent;
    color: var(--accent);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .new-assistant-btn:hover { border-color: var(--accent); background: var(--panel); }

  /* Main pane */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px 12px 2px 12px;
    max-width: 70%;
    white-space: pre-wrap;
  }
  .msg-error {
    align-self: flex-start;
    background: rgba(255, 107, 107, .12);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 107, .3);
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
  }
  .msg-loading { align-self: flex-start; color: var(--muted); font-size: 14px; }

  .spec-card {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    max-width: 85%;
  }
  .spec-card h3 { margin: 0 0 8px; font-size: 16px; }
  .spec-card .objective { color: var(--muted); margin-bottom: 10px; }
  .spec-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .spec-card ul { margin: 0; padding-left: 18px; }
  .spec-card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: rgba(91, 140, 255, .15);
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .spec-card details { margin-top: 12px; }
  .spec-card summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .spec-card pre {
    background: #0f1115;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    margin-top: 6px;
  }

  #composer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    min-height: 44px;
    max-height: 160px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:disabled { opacity: .5; cursor: not-allowed; }
  /* Edit mode swaps the filled primary for an accent outline — the color reinforces the mode alongside the label. */
  #actionBtn.editing { background: var(--panel); border: 1px solid var(--accent); color: var(--accent); }

  /* Session panel (right column) */
  #session {
    width: 340px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  #session h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
  #runControls { display: flex; gap: 8px; margin-bottom: 8px; }
  #leadSelect {
    flex: 1;
    /* min-width:0 lets the flex item shrink below its long option text so the
       panel doesn't overflow horizontally; the native select truncates instead. */
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  #session button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #session button:disabled { opacity: .5; cursor: not-allowed; }
  #reconnectBtn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); width: 100%; margin-bottom: 12px; }
  #steps { display: flex; flex-direction: column; gap: 8px; }
  .step-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .step-card .step-head { display: flex; align-items: center; gap: 8px; }
  .step-card .step-tool { font-weight: 600; font-size: 14px; }
  .step-card .step-outcome {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .step-card .step-summary { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #outcome { margin-top: 14px; }
  .outcome-badge {
    display: inline-block;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .03em;
    border-radius: 8px;
    padding: 6px 12px;
  }
  .outcome-booked { background: rgba(74, 222, 128, .15); color: #4ade80; border: 1px solid rgba(74, 222, 128, .35); }
  .outcome-not_qualified { background: rgba(251, 191, 36, .15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, .35); }
  .outcome-unreachable { background: rgba(255, 107, 107, .12); color: var(--danger); border: 1px solid rgba(255, 107, 107, .3); }
  .outcome-line { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .session-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .session-error { color: var(--danger); font-size: 13px; }
</style>

<div id="sidebar">
  <div class="panel-head">
    <h2>Saved assistants</h2>
    <button class="panel-toggle" id="sidebarToggle" title="Collapse" aria-label="Collapse panel">‹</button>
  </div>
  <button id="newAssistantBtn" class="new-assistant-btn">+ New assistant</button>
  <div id="specList"></div>
</div>

<div id="main">
  <header>Assistant Builder</header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" placeholder="Describe the assistant you want…" rows="1"></textarea>
    <button id="actionBtn">Create</button>
  </div>
</div>

<div id="session">
  <div class="panel-head">
    <h2>Live session</h2>
    <button class="panel-toggle" id="sessionToggle" title="Collapse" aria-label="Collapse panel">›</button>
  </div>
  <div id="runControls">
    <select id="leadSelect"></select>
    <button id="runBtn" disabled>Run</button>
  </div>
  <button id="reconnectBtn" disabled>Reconnect stream</button>
  <div id="steps"></div>
  <div id="outcome"></div>
</div>

<script src="/static/app.js"></script>
