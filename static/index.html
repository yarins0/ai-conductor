<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Builder</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --border: #2b2f37;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }

  /* Collapsible side panels: a header row holds the title + a chevron toggle.
     Collapsing swaps a .collapsed class that shrinks the panel to a thin strip
     and hides everything but the toggle. */
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    padding: 0;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .panel-toggle:hover { color: var(--text); border-color: var(--accent); }
  #sidebar.collapsed { width: 44px; padding-left: 10px; padding-right: 10px; overflow: hidden; }
  #sidebar.collapsed > *:not(.panel-head) { display: none; }
  #sidebar.collapsed .panel-head h2 { display: none; }
  #sidebar.collapsed .panel-head { justify-content: center; }
  .spec-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .spec-item:hover { background: var(--panel); }
  .spec-item.active { background: var(--panel); border: 1px solid var(--accent); }
  .spec-item .name { font-size: 14px; font-weight: 600; }
  .spec-item .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty-hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  /* Dashed outline reads as "add"; stays quiet so the composer keeps the one filled primary. */
  .new-assistant-btn {
    width: 100%;
    background: transparent;
    color: var(--accent);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .new-assistant-btn:hover { border-color: var(--accent); background: var(--panel); }

  /* Main pane */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  /* Launch opens the live session in its own window; disabled until a spec is
     active, since there's nothing to run without one. */
  #launchBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #launchBtn:disabled { opacity: .5; cursor: not-allowed; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px 12px 2px 12px;
    max-width: 70%;
    white-space: pre-wrap;
  }
  .msg-error {
    align-self: flex-start;
    background: rgba(255, 107, 107, .12);
    color: var(--danger);
    border: 1px solid rgba(255, 107, 107, .3);
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
  }
  .msg-loading { align-self: flex-start; color: var(--muted); font-size: 14px; }

  .spec-card {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    max-width: 85%;
  }
  .spec-card h3 { margin: 0 0 8px; font-size: 16px; }
  .spec-card .objective { color: var(--muted); margin-bottom: 10px; }
  .spec-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .spec-card ul { margin: 0; padding-left: 18px; }
  .spec-card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: rgba(91, 140, 255, .15);
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, .3);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .spec-card details { margin-top: 12px; }
  .spec-card summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .spec-card pre {
    background: #0f1115;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    margin-top: 6px;
  }

  #composer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    min-height: 44px;
    max-height: 160px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:disabled { opacity: .5; cursor: not-allowed; }
  /* Edit mode swaps the filled primary for an accent outline — the color reinforces the mode alongside the label. */
  #actionBtn.editing { background: var(--panel); border: 1px solid var(--accent); color: var(--accent); }

  /* Sidebar actions: separated from the assistants list with a divider so the
     two buttons read as their own group, not more list items. */
  #sidebarActions {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #sidebarActions button {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  #sidebarActions button:hover { border-color: var(--accent); background: var(--panel); }

  /* Dialogs: native <dialog> gets the same panel/border treatment as the rest
     of the page, plus a dimmed backdrop (free with ::backdrop). */
  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { margin: 0 0 14px; font-size: 16px; }
  #leadsDialog { max-width: 720px; }
  #settingsDialog { max-width: 420px; }
  .dialog-wrap { overflow-x: auto; }
  .dialog-error { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .dialog-error:empty { display: none; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dialog-actions button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .dialog-actions button:disabled { opacity: .5; cursor: not-allowed; }
  .dialog-actions .secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }

  #leadsTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  #leadsTable th {
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  #leadsTable td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  #leadsTable input, #leadsTable select {
    width: 100%;
    min-width: 90px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    font-size: 13px;
  }
  #leadsTable td:last-child { white-space: nowrap; }
  #leadsTable td:last-child button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
  }
  #leadsTable td:last-child button:hover { border-color: var(--accent); }
  #leadsTable td:last-child button:disabled { opacity: .5; cursor: not-allowed; }

  #settingsForm .provider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #settingsForm label { flex: 0 0 100px; color: var(--muted); font-size: 12px; text-transform: capitalize; }
  #settingsForm select {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
</style>

<div id="sidebar">
  <div class="panel-head">
    <h2>Saved assistants</h2>
    <button class="panel-toggle" id="sidebarToggle" title="Collapse" aria-label="Collapse panel">‹</button>
  </div>
  <button id="newAssistantBtn" class="new-assistant-btn">+ New assistant</button>
  <div id="specList"></div>
  <div id="sidebarActions">
    <button id="manageLeadsBtn">Manage leads</button>
    <button id="settingsBtn">Settings</button>
  </div>
</div>

<div id="main">
  <header>
    <span>Assistant Builder</span>
    <button id="launchBtn" disabled>Launch assistant ↗</button>
  </header>
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" placeholder="Describe the assistant you want…" rows="1"></textarea>
    <button id="actionBtn">Create</button>
  </div>
</div>

<dialog id="leadsDialog">
  <h2>Leads</h2>
  <div class="dialog-wrap">
    <table id="leadsTable">
      <thead>
        <tr>
          <th>Name</th><th>Company</th><th>Phone</th><th>Email</th><th>Sim profile</th><th>Notes</th><th></th>
        </tr>
      </thead>
      <tbody id="leadsTableBody"></tbody>
    </table>
  </div>
  <div id="leadsDialogError" class="dialog-error"></div>
  <div class="dialog-actions">
    <button type="button" id="closeLeadsDialogBtn" class="secondary">Close</button>
  </div>
</dialog>

<dialog id="settingsDialog">
  <h2>Providers</h2>
  <div id="settingsForm"></div>
  <div id="settingsDialogError" class="dialog-error"></div>
  <div class="dialog-actions">
    <button type="button" id="closeSettingsDialogBtn" class="secondary">Close</button>
    <button type="button" id="saveSettingsBtn">Save</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
